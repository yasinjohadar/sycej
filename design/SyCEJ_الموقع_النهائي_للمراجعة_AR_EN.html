/* Media archive: verified original-broadcaster videos and article source cards */
.mediaThumb{overflow:hidden;background:linear-gradient(128deg,#183751,#226b84)}
.videoPoster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.74)}
.mediaThumb .play{position:relative;z-index:2;box-shadow:0 8px 26px rgba(0,0,0,.18)}
.articleThumb{background:linear-gradient(125deg,#17324d,#27768a)}
.articleLogo{padding:20px;text-align:center;display:flex;flex-direction:column;gap:5px;color:white}
.articleLogo span{font-size:11px;letter-spacing:.2em;opacity:.72}
.articleLogo strong{font-size:18px;line-height:1.5}
.mediaThumb:has(iframe){height:215px}
@media(max-width:700px){.mediaThumb{height:175px}}

/* Contact details: visible in both page and footer. */
.contact-value{color:#175a70;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.footer-contact{display:flex;flex-wrap:wrap;align-items:center;gap:7px 12px;margin:12px 0 14px;font-size:13px}
.footer-contact a{color:#d7e9f0;text-decoration:underline;text-underline-offset:3px;direction:ltr;white-space:nowrap}
.footer-contact .footer-sep{opacity:.65}
@media(max-width:520px){.footer-contact{display:flex;flex-direction:column;align-items:flex-start;gap:7px}.footer-contact .footer-sep{display:none}}

/* NCEJ-inspired information architecture; independent SyCEJ design. */
.editorial{max-width:900px;font-size:16px;line-height:2;color:#365064}
.editorial p{margin:9px 0 19px}.editorial h2{font-size:23px;color:#17324d;margin:34px 0 14px}
.editorial h3{font-size:19px;margin:28px 0 11px}.editorial strong{color:#17324d}
.editorial ul{padding-inline-start:27px}.editorial li{margin-block:7px}
.editorial h2:first-child{display:none}
.editorSection{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 34px;margin-bottom:20px;box-shadow:0 8px 27px rgba(25,49,64,.025)}
.editorSection>h2{font-size:25px;margin:8px 0 25px}.articleStack{display:grid;gap:8px}
.gotoCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;text-decoration:none;display:flex;align-items:center;justify-content:space-between;font-size:17px;transition:transform .2s ease,box-shadow .2s ease}
.gotoCard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.goIcon{font-size:21px;color:#258f92}
.heroMark{max-height:200px}.miniContacts{display:flex;flex-wrap:wrap;gap:12px}.miniContacts a{border-radius:10px;background:#f2f8f8;border:1px solid var(--line);padding:10px 15px;text-decoration:none;direction:ltr}
.founderCard p{color:#577082}.mutedText{color:#607789}
@media(max-width:700px){.editorSection{padding:22px}.editorial{font-size:14px}.editorial h2{font-size:20px}.miniContacts{display:grid}.hero h1{font-size:33px}.mediaGrid{grid-template-columns:1fr}}

function areaPage(){return `${heading(T('areas'),'01 · SyCEJ')}<section class="shell container"><div class="notice">${esc(T('approved'))}</div><div class="grid3">${cards()}</div></section>`}
function infoPage(title,tiles){return `${heading(title)}<section class="shell container"><div class="grid2">${tiles.map(([h,secondary])=>`<article class="block"><h2>${esc(h)}</h2>${secondary?`<p class="caption">${esc(secondary)}</p>`:''}${human()}</article>`).join('')}</div></section>`}
function mediaList(kind='all'){const array=DATA.media.filter(m=>kind==='all'||m.kind===kind);return array.map(m=>`<article class="mediaCard" data-kind="${esc(m.kind)}"><div class="mediaThumb ${m.kind==='article'?'articleThumb':''}">${m.youtubeId?`<img class="videoPoster" src="https://i.ytimg.com/vi/${m.youtubeId}/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.display='none'"><button class="play" onclick="showVideo('${m.youtubeId}',this)" aria-label="${esc(T('play'))}">▶</button>`:`<span class="articleLogo"><span>SyCEJ / MEDIA</span><strong>${esc(m.channel)}</strong></span>`}</div><div class="mediaInfo"><div class="meta"><span class="pill">${esc(T(m.kind))}</span>${m.date?`<span class="pill">${esc(m.date)}</span>`:''}<span class="pill">${esc(m.channel)}</span></div><h3 dir="rtl" lang="ar">${esc(m.originalTitle)}</h3><p>${esc(T('mediaNote'))}</p><a class="btn small" target="_blank" rel="noopener noreferrer" href="${esc(m.url)}">${esc(T('external'))} ↗</a></div></article>`)}
function mediaPage(){return `${heading(T('media'),'MEDIA / SyCEJ')}<section class="shell container"><div class="notice">${esc(T('mediaNote'))} ${esc(T('publisher'))}</div><div class="tabBar" role="group" aria-label="${esc(T('tabs'))}">${['all','video','article'].map(k=>`<button class="tab ${k===filter?'sel':''}" onclick="setFilter('${k}')">${esc(T(k))}</button>`).join('')}</div><div class="mediaGrid">${mediaList(filter).join('')}</div></section>`}
function teamPage(){return `${heading(T('teamHeader'),'TEAM / SyCEJ')}<section class="shell container">${intro(T('teamHeader'),'01')}<div class="grid2"><div class="block"><h2>${esc(lang==='ar'?'المؤسس':'Founder')}</h2>${human()}</div><div class="block"><h2>${esc(lang==='ar'?'الفريق والمستشارون':'Team & Advisors')}</h2>${human()}</div></div><div class="feature">${intro(T('founder'),'02',T('noActivities'))}<div class="mediaGrid">${mediaList('video').join('')}</div></div></section>`}
function contact(){return `${heading(T('contact'),'CONTACT')}<section class="shell container"><div class="contactGrid"><div class="block"><h2>${esc(T('information'))}</h2><div class="listline"><b>${esc(T('location'))}</b><div>${esc(DATA.site['location'+lang.toUpperCase()])}</div></div><div class="listline"><b>${esc(T('phone'))}</b><div dir="ltr" style="text-align:start"><a class="contact-value" href="tel:${esc(DATA.site.phoneDial)}">${esc(DATA.site.phone)}</a></div></div><div class="listline"><b>${esc(T('email'))}</b><div dir="ltr" style="text-align:start"><a class="contact-value" href="mailto:${esc(DATA.site.email)}">${esc(DATA.site.email)}</a></div></div><div class="listline"><b>${esc(T('whatsapp'))}</b><div dir="ltr" style="text-align:start"><a class="contact-value" href="${esc(DATA.site.whatsappUrl)}" target="_blank" rel="noopener noreferrer">${esc(DATA.site.phone)}</a></div></div><div class="listline"><b>${esc(T('website'))}</b><div dir="ltr" style="text-align:start"><a class="contact-value" href="https://${esc(DATA.site.domain)}" target="_blank" rel="noopener noreferrer">${esc(DATA.site.domain)}</a></div></div><a class="social" href="${esc(DATA.site.facebook)}" target="_blank" rel="noopener noreferrer">${esc(T('facebook'))} ↗</a></div><div class="block"><h2>${esc(T('form'))}</h2><div class="notice">${esc(T('pending'))}</div><div class="field">${lang==='ar'?'الاسم':'Name'}</div><div class="field">${lang==='ar'?'البريد الإلكتروني':'Email'}</div><div class="field">${lang==='ar'?'الرسالة':'Message'}</div><button class="btn primary" disabled>${esc(lang==='ar'?'إرسال':'Send')}</button></div></div></section>`}
const SOURCE_HTML={"home": "<p>الصفحة الرئيسية</p>\n<h2>نحو بيئة سليمة وعدالة تحمي الإنسان والطبيعة</h2>\n<p>البيئة ليست قضية منفصلة عن حياة الناس. فسلامة المياه التي نشربها، والتربة التي نزرعها، والهواء الذي نتنفسه، ترتبط مباشرة بصحتنا وسبل عيشنا ومستقبل مجتمعاتنا.</p>\n<p>في سوريا، تتداخل التحديات البيئية مع آثار سنوات طويلة من الأزمات، من تلوث الموارد الطبيعية وتراكم النفايات إلى تغير المناخ والضغوط المتزايدة على المياه والأراضي الزراعية.</p>\n<p>نؤمن بأن الحلول البيئية الناجحة تبدأ بفهم المشكلة والإنصات إلى الناس، ثم تحويل المعرفة والخبرة إلى خطوات واقعية يمكن البناء عليها.</p>\n<h2>ماذا نقدم؟</h2>\n<h3>العدالة البيئية والمناخية</h3>\n<p>نعزز المعرفة بالحقوق البيئية، ونشجع المشاركة المجتمعية، وندعم تطوير القدرات القانونية والفنية للتعامل مع القضايا البيئية.</p>\n<h3>الدراسات والبحوث البيئية</h3>\n<p>نسعى إلى إعداد الدراسات والتحليلات التي تساعد على فهم التلوث والمخاطر البيئية، وتحديد الأولويات، واقتراح حلول علمية قابلة للتطبيق.</p>\n<h3>التوعية وبناء القدرات</h3>\n<p>نساهم في نشر الثقافة البيئية وتطوير المهارات، وتشجيع المبادرات المحلية والتعاون بين المختصين والمؤسسات والمجتمع.</p>\n<h2>لمن نعمل؟</h2>\n<p><strong>للمجتمعات المحلية:</strong> من خلال المعرفة والتوعية والمشاركة في فهم التحديات البيئية.</p>\n<p><strong>للطلاب والباحثين:</strong> من خلال تبادل المعرفة والأنشطة العلمية وفرص التعلم والتعاون.</p>\n<p><strong>للمهندسين والمحامين والخبراء:</strong> من خلال تطوير القدرات والعمل المشترك في القضايا البيئية والفنية والقانونية.</p>\n<p><strong>للمؤسسات العامة:</strong> من خلال الدراسات والمقترحات الفنية والتعاون في المجالات ذات الاهتمام المشترك.</p>\n<p><strong>للمنظمات والجهات الداعمة:</strong> من خلال تطوير مبادرات قائمة على الاحتياجات المحلية والنتائج القابلة للقياس.</p>\n", "about": "<p>من نحن؟</p>\n<p>جاءت فكرة المركز استجابة للحاجة إلى عمل بيئي يجمع بين المعرفة الهندسية والقانونية والبعد الإنساني، ويساعد على فهم المشكلات البيئية وآثارها على المجتمعات، وتطوير حلول واقعية تراعي الحقوق والاحتياجات المحلية.</p>\n<p>لا ننظر إلى العدالة البيئية باعتبارها مفهوماً قانونياً مجرداً، بل باعتبارها جزءاً من الحياة اليومية؛ فمن حق المجتمعات أن تتوفر لها المعرفة المتعلقة بالمخاطر البيئية، وأن تتاح لها فرص المشاركة في القضايا التي تؤثر على صحتها ومواردها وسبل عيشها.</p>\n<p>يسعى المركز إلى العمل بالتعاون مع المؤسسات العامة والجامعات ومراكز البحث والمنظمات والمجتمعات المحلية، مع احترام اختصاصات الجهات الحكومية والحفاظ على استقلاله المهني.</p>\n", "vision": "<p>رؤيتنا ورسالتنا</p>\n<h2>رؤيتنا</h2>\n<p>سوريا يتمتع فيها الإنسان ببيئة صحية وآمنة، وتُصان فيها الحقوق البيئية والمناخية، وتُدار مواردها الطبيعية بصورة مسؤولة وعادلة ومستدامة.</p>\n<h2>رسالتنا</h2>\n<p>المساهمة في حماية البيئة وتعزيز العدالة البيئية والمناخية في سوريا، من خلال الدراسات والبحوث، والتوعية، وبناء القدرات، ودعم المعرفة القانونية والمشاركة المجتمعية، وتطوير التعاون مع الجهات المعنية لخدمة الصالح العام.</p>\n<h2>قيمنا</h2>\n<p><strong>العدالة:</strong> الاهتمام بحقوق الإنسان البيئية، ولا سيما المجتمعات الأكثر تعرضاً للمخاطر.</p>\n<p><strong>الاستقلالية:</strong> العمل وفق مبادئ مهنية وعلمية واضحة.</p>\n<p><strong>النزاهة:</strong> احترام الأدلة والمعلومات الموثوقة والشفافية في عرض النتائج.</p>\n<p><strong>المشاركة:</strong> إشراك المجتمع والاستماع إلى احتياجاته وخبراته.</p>\n<p><strong>التعاون:</strong> العمل مع المؤسسات والجهات المعنية على أساس التكامل واحترام الأدوار.</p>\n<p><strong>المسؤولية:</strong> الالتزام بالمصلحة العامة والاستدامة والمساءلة.</p>\n", "areas": "<p>مجالات عملنا</p>\n<h2>1. العدالة البيئية والمناخية والحقوق</h2>\n<p>نعمل على تعزيز فهم العلاقة بين البيئة وحقوق الإنسان، ودعم المعرفة القانونية والمشاركة المجتمعية في القضايا البيئية.</p>\n<p>يشمل هذا المجال:</p>\n<ul>\n<li>نشر الوعي بالحقوق والتشريعات البيئية.</li>\n<li>إعداد الدراسات القانونية وتحليل السياسات البيئية.</li>\n<li>دعم الوصول إلى المعلومات البيئية.</li>\n<li>بناء قدرات المختصين والمهتمين بالقضايا البيئية.</li>\n<li>تعزيز التعاون بين الخبرات القانونية والهندسية.</li>\n<li>المساهمة في تطوير المعرفة المتعلقة بالعدالة المناخية والحقوق البيئية.</li>\n</ul>\n<p>وتُمارس الأنشطة القانونية ضمن الحدود والصلاحيات التي تسمح بها التشريعات النافذة.</p>\n<h2>2. الدراسات والبحوث البيئية</h2>\n<p>نسعى إلى تطوير دراسات فنية وعلمية تسهم في فهم المشكلات البيئية في سوريا، وتساعد المؤسسات والمجتمعات على تحديد الأولويات والخيارات المناسبة.</p>\n<p>تشمل اهتماماتنا:</p>\n<ul>\n<li>إدارة النفايات والتلوث الناتج عنها.</li>\n<li>حماية التربة والموارد المائية.</li>\n<li>إدارة مياه الصرف الصحي والحمأة.</li>\n<li>تقييم الأثر البيئي والاجتماعي.</li>\n<li>تغير المناخ والتكيف مع آثاره.</li>\n<li>تقييم المخاطر البيئية وتحليل البيانات.</li>\n<li>التعافي البيئي في المناطق المتضررة.</li>\n</ul>\n<p>وتُقدم الدراسات والتحليلات بوصفها أعمالاً بحثية وفنية، وليست بديلاً عن أعمال التفتيش أو الرصد أو الاعتماد الرسمي للجهات المختصة.</p>\n<h2>3. التوعية وبناء القدرات والشراكات</h2>\n<p>نعمل على تقريب المعرفة البيئية من المجتمع، وربط الخبرات العلمية بالاحتياجات العملية.</p>\n<p>يشمل هذا المجال:</p>\n<ul>\n<li>تنظيم الندوات والورش والأنشطة التوعوية.</li>\n<li>تطوير برامج تدريبية للطلاب والمهندسين والباحثين.</li>\n<li>التعاون مع الجامعات والمؤسسات العلمية.</li>\n<li>دعم المبادرات البيئية المجتمعية.</li>\n<li>تبادل الخبرات مع المؤسسات الوطنية والدولية.</li>\n<li>إعداد أدلة معرفية وتوعوية متخصصة.</li>\n</ul>\n", "method": "<p>كيف نعمل؟</p>\n<h2>المعرفة أولاً، ثم العمل المشترك</h2>\n<p>نؤمن بأن التعامل المسؤول مع القضايا البيئية يبدأ بفهم المشكلة وأسبابها وآثارها، قبل اقتراح الحلول.</p>\n<p>لذلك يعتمد نهج المركز على تحديد الاحتياجات، والاستماع إلى الجهات والمجتمعات المعنية، وتحليل المعلومات المتاحة، ثم تطوير المقترحات المناسبة بالتعاون مع أصحاب الاختصاص.</p>\n<p>نحرص على أن تكون الحلول المقترحة واقعية وقابلة للتطبيق، وأن تراعي الظروف المحلية والموارد المتاحة، وأن تستند إلى أدلة يمكن مراجعتها وتطويرها.</p>\n<p>كما نؤمن بأن نجاح أي مبادرة بيئية لا يقاس بعدد الأنشطة وحده، بل بما تضيفه من معرفة أو قدرات أو تحسينات ملموسة للمجتمع.</p>\n", "programs": "<p>البرامج والمبادرات</p>\n<h2>من الفكرة إلى الأثر</h2>\n<p>يخصص هذا القسم للتعريف بالمبادرات والبرامج البيئية التي يعمل المركز على تطويرها أو تنفيذها، مع توضيح أهداف كل مبادرة والفئات المستهدفة والشركاء والنتائج.</p>\n<p>وتشمل المجالات التي يسعى المركز إلى تطوير مبادرات فيها حماية التربة والمياه، وإدارة النفايات، والعدالة البيئية، والتكيف المناخي، والتوعية الصحية البيئية، وبناء القدرات المحلية.</p>\n<p>سيجري التمييز بين المبادرات المقترحة، والأنشطة قيد التحضير، والمشاريع المنفذة، مع نشر النتائج الموثقة عند توفرها.</p>\n", "knowledge": "<p>الدراسات والمعرفة</p>\n<h2>مساحة للبحث والتعلم وتبادل الخبرات</h2>\n<p>يطمح المركز إلى توفير مساحة معرفية تضم الدراسات والأوراق الفنية والأدلة والمراجع المتعلقة بالبيئة والعدالة المناخية في سوريا.</p>\n<p>ويهدف هذا القسم إلى مساعدة الباحثين والطلاب والمهندسين والمحامين والمؤسسات والمهتمين على الوصول إلى معرفة موثوقة يمكن الاستفادة منها في البحث والعمل والتوعية.</p>\n<p>تُعرض المواد العلمية مع بيان مصادرها وتواريخها والجهات التي أعدتها، مع احترام حقوق النشر والملكية الفكرية.</p>\n", "partners": "<p>التعاون والشراكات</p>\n<h2>العمل البيئي مسؤولية مشتركة</h2>\n<p>لا يمكن مواجهة التحديات البيئية المعقدة بجهود مؤسسة واحدة. فالتقدم الحقيقي يحتاج إلى تعاون الجهات العامة والجامعات والمنظمات والقطاع الخاص والمجتمعات المحلية.</p>\n<p>يسعى المركز إلى بناء علاقات تعاون في مجالات الدراسات والبحوث والتوعية وبناء القدرات والمبادرات البيئية.</p>\n<p><strong>مع الجهات الحكومية:</strong> نعمل على تطوير فرص التعاون الفني والمعرفي بما يدعم الجهود العامة ويحترم الاختصاصات المؤسسية.</p>\n<p><strong>مع الجامعات والباحثين:</strong> نشجع التعاون العلمي والدراسات التطبيقية وتبادل الخبرات.</p>\n<p><strong>مع المنظمات والجهات المانحة:</strong> نتطلع إلى تطوير مبادرات تستجيب للاحتياجات الفعلية، وتراعي الحوكمة والاستدامة والنتائج القابلة للقياس.</p>\n<p><strong>مع المجتمع المدني:</strong> نؤمن بتبادل الخبرات وتكامل الجهود وتوسيع المشاركة المجتمعية.</p>\n<p><strong>مع القطاع الخاص:</strong> نشجع الممارسات البيئية المسؤولة والتعاون في المبادرات ذات المنفعة العامة.</p>\n", "governance": "<p>الحوكمة والشفافية</p>\n<p>يلتزم المركز بتطوير عمل مؤسسي يقوم على وضوح المسؤوليات والنزاهة والمساءلة واحترام التشريعات النافذة.</p>\n<p>ويولي أهمية لوضع سياسات وإجراءات تنظم الإدارة والموارد وتضارب المصالح وحماية البيانات والتعاون مع الشركاء.</p>\n<p>ومع استكمال إجراءات الإشهار والتأسيس، سيجري نشر المعلومات المؤسسية والوثائق والسياسات التي يمكن إتاحتها للجمهور وفق المتطلبات القانونية.</p>\n", "news": "<p>الأخبار والأنشطة</p>\n<p>يخصص هذا القسم لمشاركة أخبار المركز وأنشطته وفعالياته العلمية والمجتمعية، والإعلان عن فرص المشاركة والتعاون.</p>\n<p>وسيُراعى توضيح طبيعة كل نشاط والجهة المنظمة ودور المركز فيه، والتمييز بين المبادرات المستقلة والأنشطة المنفذة بالتعاون مع جهات أخرى.</p>\n"};


const contentAvailable=()=>lang==='ar';
function originalCopy(key){return contentAvailable()?`<div class="editorial" lang="ar" dir="rtl">${SOURCE_HTML[key]||''}</div>`:human()}
function sectionBox(head,html,desc=''){return `<article class="editorSection"><div class="eyebrow">SyCEJ</div><h2>${esc(head)}</h2>${desc?`<p class="mutedText">${esc(desc)}</p>`:''}${html}</article>`}
function reviewStatus(){return `<div class="notice">${esc(T('notice'))} ${esc(T('noStats'))}</div>`}
function aboutPage(){return `${heading(T('about'),'SYCEJ / ABOUT')}<section class="shell container">${reviewStatus()}<div class="articleStack">${sectionBox(lang==='ar'?'التعريف بالمركز':'Institutional Profile',originalCopy('about'))}${sectionBox(lang==='ar'?'الرؤية والرسالة والقيم':'Vision, Mission & Values',originalCopy('vision'))}<div class="grid2">${linkCard(T('team'),'team')}${linkCard(T('governance'),'governance')}</div></div></section>`}
function linkCard(title,to){return `<a class="gotoCard" href="${path(to)}"><span class="goIcon">↗</span><b>${esc(title)}</b></a>`}
function areaPage(){return `${heading(T('areas'),'SYCEJ / FOCUS')}<section class="shell container"><div class="grid3">${cards()}</div><div class="feature">${sectionBox(lang==='ar'?'مجالات عملنا بالتفصيل':'Areas of Work',originalCopy('areas'))}</div></section>`}
function home(){return `<section class="hero"><div class="shell heroGrid"><div><div class="eyebrow">SyCEJ · ${esc(T('heroLabel'))}</div><h1>${esc(lang==='ar'?'حين يصبح التلوث قضية حق':DATA.site.siteNameEN)}</h1><div class="subtitle">${lang==='ar'?'البيئة ليست قضية منفصلة عن حياة الناس. فسلامة المياه التي نشربها، والتربة التي نزرعها، والهواء الذي نتنفسه، ترتبط مباشرة بصحتنا وسبل عيشنا ومستقبل مجتمعاتنا.':human()}</div><div class="actions">${a('areas',T('learn'),'btn primary')}${a('media',T('archive'),'btn')}${a('contact',T('contact'),'btn')}</div></div><div class="shape"><img class="heroMark" src="${document.querySelector('.brand img').getAttribute('src')}" alt="SyCEJ"><span class="ribbon">SyCEJ · Aleppo, Syria</span></div></div></section><section class="shell container">${intro(T('areas'),'01 · SYCEJ')}<div class="grid3">${cards()}</div></section><section class="band"><div class="shell container">${intro(T('teamHeader'),'02 · SYCEJ')}<div class="grid2">${linkCard(T('team'),'team')}${linkCard(T('governance'),'governance')}</div></div></section><section class="shell container">${intro(T('mediaHeader'),'03 · MEDIA')}<div class="notice">${esc(T('mediaNote'))}</div><div class="mediaGrid">${mediaList('video').join('')}</div><div class="feature"><h3>${esc(lang==='ar'?'مختارات من المقالات الصحفية':'Selected Press Articles')}</h3><div class="mediaGrid">${mediaList('article').slice(0,2).join('')}</div></div><div class="actions">${a('media',T('archive'),'btn primary')}</div></section><section class="band"><div class="shell container">${intro(T('knowledge'),'04 · LIBRARY')}<div class="grid2">${linkCard(T('study'),'knowledge')}${linkCard(T('legal'),'knowledge')}</div></div></section><section class="shell container">${intro(T('contact'),'05 · CONTACT')}<div class="miniContacts"><a href="mailto:${DATA.site.email}">${DATA.site.email}</a><a href="tel:${DATA.site.phoneDial}" dir="ltr">${DATA.site.phone}</a><a href="${DATA.site.whatsappUrl}" target="_blank" rel="noopener">WhatsApp</a><a href="https://${DATA.site.domain}" target="_blank" rel="noopener">${DATA.site.domain}</a></div></section>`}
function programsPage(){return `${heading(T('programs'),'PROGRAMS / SYCEJ')}<section class="shell container">${sectionBox(T('programs'),originalCopy('programs'))}<div class="notice">${esc(T('noStats'))}</div><div class="grid3">${['proposal','preparation','completed'].map((key,i)=>`<div class="block"><div class="num">0${i+1}</div><h3>${esc(lang==='ar'?['مقترح','قيد التحضير','منفذ'][i]:['Proposed','In Preparation','Completed'][i])}</h3>${human()}</div>`).join('')}</div></section>`}
function knowledgePage(){return `${heading(T('knowledge'),'RESEARCH / SYCEJ')}<section class="shell container">${sectionBox(lang==='ar'?'الدراسات والمعرفة':'Studies & Knowledge',originalCopy('knowledge'))}<div class="grid2">${sectionBox(T('study'),human())}${sectionBox(T('legal'),human())}</div><div class="notice">${esc(T('noStats'))}</div></section>`}
function partnersPage(){return `${heading(T('partners'),'PARTNERSHIPS / SYCEJ')}<section class="shell container">${sectionBox(T('partners'),originalCopy('partners'))}<div class="notice">${esc(T('noStats'))}</div></section>`}
function governancePage(){return `${heading(T('governance'),'GOVERNANCE / SYCEJ')}<section class="shell container">${reviewStatus()}${sectionBox(T('governance'),originalCopy('governance'))}<div class="grid3">${['registration','policies','reports'].map((k,i)=>`<div class="block"><div class="num">0${i+1}</div><h3>${esc(lang==='ar'?['وثائق التسجيل','السياسات والإجراءات','التقارير والإفصاحات'][i]:['Registration Documents','Policies and Procedures','Reports and Disclosures'][i])}</h3>${human()}</div>`).join('')}</div></section>`}
function teamPage(){return `${heading(T('teamHeader'),'TEAM / SYCEJ')}<section class="shell container"><div class="grid2"><article class="block founderCard"><div class="eyebrow">SyCEJ · FOUNDER</div><h2>${esc(lang==='ar'?'كامل شمس الدين':'Kamel Shams Alddin')}</h2><p>${esc(lang==='ar'?'مهندس واستشاري بيئي':'Environmental Engineer & Consultant')}</p>${human()}</article><article class="block"><h2>${esc(lang==='ar'?'الفريق والمستشارون':'Team & Advisors')}</h2>${human()}</article></div><div class="feature">${intro(T('founder'),'PREVIOUS MEDIA')}<div class="notice">${esc(T('mediaNote'))}</div><div class="mediaGrid">${mediaList('video').join('')}</div><div class="actions">${a('media',T('archive'),'btn')}</div></div></section>`}

function route(){const match=(location.hash||'#/ar/home').match(/^#\/(ar|en)\/([a-z-]+)/);lang=match?match[1]:'ar';page=match&&PAGES.includes(match[2])?match[2]:'home';render()}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=`${T(page)} · SyCEJ`;const nav=['home','about','areas','programs','knowledge','media','team','partners','governance','contact'];document.getElementById('nav').innerHTML=nav.map(k=>a(k,T(k),page===k?'on':'')).join('');document.getElementById('preview').textContent=T('preview');document.getElementById('brandname').textContent=DATA.site['siteName'+lang.toUpperCase()];document.querySelector('.brand').setAttribute('href',path('home'));document.querySelectorAll('.footer .stack a').forEach((el,i)=>el.setAttribute('href',path(['about','areas','knowledge','media','governance','contact'][i])));document.getElementById('langButton').textContent=lang==='ar'?'EN':'عربي';document.getElementById('langButton').setAttribute('aria-label',lang==='ar'?'Switch to English':'التحويل إلى العربية');document.getElementById('footName').textContent=DATA.site['siteName'+lang.toUpperCase()];document.getElementById('footNote').textContent=T('notice');document.getElementById('copyright').textContent=T('updated');document.getElementById('mobileMenu').setAttribute('aria-label',T('contents'));
let body='';switch(page){case'home':body=home();break;case'areas':body=areaPage();break;case'about':body=aboutPage();break;case'programs':body=programsPage();break;case'knowledge':body=knowledgePage();break;case'media':body=mediaPage();break;case'team':body=teamPage();break;case'partners':body=partnersPage();break;case'governance':body=governancePage();break;case'contact':body=contact();break;}document.getElementById('app').innerHTML=body;document.getElementById('nav').classList.remove('expanded');window.scrollTo(0,0)}
window.showVideo=function(id,btn){if(!/^[\w-]{11}$/.test(id))return;btn.parentNode.innerHTML=`<iframe title="${esc(T('play'))}" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" loading="lazy"></iframe>`};window.setFilter=function(f){filter=f;render()};document.getElementById('langButton').onclick=()=>{window.location.hash=path(page,lang==='ar'?'en':'ar')};document.getElementById('mobileMenu').onclick=()=>document.getElementById('nav').classList.toggle('expanded');window.addEventListener('hashchange',route);route();</script></body></html>
